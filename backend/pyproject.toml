[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mediai-pro-backend"
version = "0.1.0"
description = "Production backend foundation for MediAI Pro"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "celery[redis]==5.6.3",
  "email-validator==2.3.0",
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "joblib==1.4.2",
  "loguru==0.7.3",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pwdlib[argon2]==0.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pyjwt[crypto]==2.13.0",
  "python-multipart==0.0.32",
  "reportlab==4.2.5",
  "redis[hiredis]==6.4.0",
  "scikit-learn==1.5.2",
  "sqlalchemy[asyncio]==2.0.51",
  "xgboost==2.1.4",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "asgi-lifespan==2.1.0",
  "black==26.5.1",
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pre-commit==4.6.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mediai"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "F",
  "FAST",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"alembic/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=mediai --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires infrastructure or exercises integration boundaries",
]

[tool.coverage.run]
branch = true
source = ["mediai"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
